<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>khuerepo</title>
    <link rel="stylesheet" href="styles.css"> 
    <link rel="icon" type="image/png" href="icon.png"> 
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        /* AJUSTE AQUÍ: Añadido width 100% y padding para que nunca se desborde en celulares */
        .landing-container .site-logo {
            width: 100%;
            max-width: 600px; 
            height: auto;
            margin-bottom: 10px;
            padding: 0 20px; /* Evita que choque de manera tosca contra los bordes físicos del teléfono */
        }

        /* Transformamos el botón en un texto puro y minimalista */
        .landing-container .minimal-button {
            font-family: 'Ballet', cursive !important;
            font-size: 3em; 
            color: var(--plata);
            text-decoration: none;
            text-transform: none;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
            
            background: none !important;
            border: none !important;
            padding: 0 !important;
            box-shadow: none !important;
        }

        /* Efecto sutil al pasar el cursor sobre el texto */
        .landing-container .minimal-button:hover {
            color: var(--text);
            transform: scale(1.02); 
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <img src="logo.png" alt="khuerepo logo" class="site-logo">
        
        <div class="button-container">
            <a href="catalog.html" class="minimal-button">khuerepo</a>
        </div>
    </div>

</body>
</html>
