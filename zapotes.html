        <h1 class="poem-title">Zapotes</h1>
        
        <pre class="poem-body">
Soy zapato y soy araña,
muy adentro pudren mis sesos,
muere todo sin mis huesos
que se orinan en mi hazaña.
Soplo el viento que me daña
y me carcome, no cesa:
bomba viva que me apresa,
son costillas los barrotes,
caldo negro de zapotes
que me enferma y que me besa..</pre>
