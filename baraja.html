        <h1 class="poem-title">Baraja</h1>
        
        <pre class="poem-body">
Bajo el cielo de julio,
Dios marcaría mi baraja.
Con un año de ventaja,
pondrías tus pies en el mundo:
gesto del amor profundo
entre María y Antonio.</pre>
