        <h1 class="poem-title">Arco</h1>
        
        <pre class="poem-body">
Cuando los dioses tropiezan,
y su viento muera parco,
mi anhelo será el arco
que tus labios hoy profesan.
Mis mundos callan y rezan
en tu piel, mi firmamento,
un lunar, un pensamiento;
eres astro que destella
y besaré cada estrella
hasta tu último momento.
</pre>
