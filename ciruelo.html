        <h1 class="poem-title">Ciruelo</h1>
        
        <pre class="poem-body">
Reloj arrastra el vuelo;
segundero morfa a cana.
En tus curvas de gitana
enraizo como ciruelo,
ufano, preso del suelo,
a la mar cedo mi barca;
niego su mirada zarca
y renuncio a ser gaviero:
de tu tierra soy entero
hasta el filo de la parca.</pre>
