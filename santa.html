        <h1 class="poem-title">Santa canela</h1>
        
        <pre class="poem-body">
Yemas que buscan costura
en arrugas, campo santo;
piel desprovista de llanto,
un silencio que fulgura.
Esencia canela augura
santidad en lo profano:
efluvio incienso cercano,
hazme uno con la laguna,
y, bajo el claro de luna,
entrégame al fin su mano.
</pre>
